#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "borgwarehouse"
name = "BorgWarehouse"
description.en = "WebUI for BorgBackup"
description.fr = "WebUI pour BorgBackup"

version = "3.1.4~ynh1"

maintainers = []

[upstream]
license = "AGPL-3.0"
website = "https://borgwarehouse.com"
admindoc = "https://borgwarehouse.com/docs/admin-manual/debian-installation/"
code = "https://github.com/ravinou/borgwarehouse"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "700M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    url = "https://github.com/ravinou/borgwarehouse/archive/refs/tags/v3.1.4.tar.gz"
    sha256 = "2e91af0c7a1a27c3751222e20d1a956e92c33a130ca95c55e534d98104d90ef1"
    autoupdate.strategy = "latest_github_tag"

    [resources.system_user]
    allow_email = true
    allow_ssh = true
    home = "/home/yunohost.app/__APP__"

    [resources.data_dir]
    subdirs = [".ssh", "repos"]

    [resources.permissions]
    main.url = "/"
    api.url = "/api"
    api.allowed = "visitors"
    api.show_tile = false
    api.protected = true
    api.auth_header = false

    [resources.ports]

    [resources.apt]
    packages = "jc, jq, borgbackup, apprise"

    [resources.nodejs]
    version = "22"
